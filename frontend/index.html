<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App - Log In</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="auth-wrap">
      <button class="theme-toggle auth-theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
        </svg>
      </button>
      <div class="auth-card">
        <h1>Todo<span>List</span></h1>
        <p class="sub">Organize your day. Admins can watch over everyone's.</p>

        <div class="tabs">
          <button
            class="tab-btn active"
            id="tabLogin"
            onclick="showTab('login')"
          >
            Log In
          </button>
          <button
            class="tab-btn"
            id="tabRegister"
            onclick="showTab('register')"
          >
            Sign Up
          </button>
        </div>

        <!-- LOGIN FORM -->
        <div class="form-panel active" id="panelLogin">
          <form id="loginForm">
            <div class="field">
              <label for="loginEmail">Email</label>
              <input
                type="email"
                id="loginEmail"
                required
                placeholder="you@example.com"
              />
            </div>
            <div class="field">
              <label for="loginPassword">Password</label>
              <input
                type="password"
                id="loginPassword"
                required
                placeholder="••••••••"
              />
            </div>
            <button type="submit" class="btn-primary">Log In</button>
          </form>
          <div class="form-msg" id="loginMsg"></div>
        </div>

        <!-- REGISTER FORM (creates a normal user account only) -->
        <div class="form-panel" id="panelRegister">
          <form id="registerForm">
            <div class="field">
              <label for="regName">Full name</label>
              <input type="text" id="regName" required placeholder="Jane Doe" />
            </div>
            <div class="field">
              <label for="regEmail">Email</label>
              <input
                type="email"
                id="regEmail"
                required
                placeholder="you@example.com"
              />
            </div>
            <div class="field">
              <label for="regPassword">Password</label>
              <input
                type="password"
                id="regPassword"
                required
                placeholder="At least 6 characters"
              />
            </div>
            <button type="submit" class="btn-primary">Create Account</button>
          </form>
          <div class="form-msg" id="registerMsg"></div>
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
