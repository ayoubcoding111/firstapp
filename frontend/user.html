<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Todos</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
    <div class="brand">Todo<span>List</span></div>
    <div class="who">
        <span id="userName"></span>
        <span class="badge">user</span>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
            </svg>
        </button>
        <button class="btn-logout" onclick="logout()">Log out</button>
    </div>
</div>

<div class="layout">
    <div class="main" style="max-width: 100%; padding: 24px 32px;">
        <div class="page-head">
            <h2>My Tasks</h2>
            <p>Drag and drop tasks between columns to update their status.</p>
        </div>

        <form class="add-form" id="addForm">
            <div class="fields">
                <input type="text" id="todoTitle" placeholder="What needs doing?" required>
                <input type="text" id="todoDescription" placeholder="Add a short note (optional)">
            </div>
            <button type="submit">Add Task</button>
        </form>

        <div id="statusMsg" class="form-msg"></div>

        <!-- Kanban Board with 4 Columns -->
        <div class="kanban-board" id="kanbanBoard">
            <!-- Column 1: Pending -->
            <div class="kanban-column" data-status="pending">
                <div class="kanban-header">
                    <h3><span class="icon">📋</span> Pending</h3>
                    <span class="kanban-count" id="count-pending">0</span>
                </div>
                <div class="kanban-cards" id="cards-pending"></div>
            </div>

            <!-- Column 2: In Progress -->
            <div class="kanban-column" data-status="in_progress">
                <div class="kanban-header">
                    <h3><span class="icon">🚀</span> In Progress</h3>
                    <span class="kanban-count" id="count-in_progress">0</span>
                </div>
                <div class="kanban-cards" id="cards-in_progress"></div>
            </div>

            <!-- Column 3: Suspended -->
            <div class="kanban-column" data-status="suspended">
                <div class="kanban-header">
                    <h3><span class="icon">⏸️</span> Suspended</h3>
                    <span class="kanban-count" id="count-suspended">0</span>
                </div>
                <div class="kanban-cards" id="cards-suspended"></div>
            </div>

            <!-- Column 4: Finished -->
            <div class="kanban-column" data-status="finished">
                <div class="kanban-header">
                    <h3><span class="icon">✅</span> Finished</h3>
                    <span class="kanban-count" id="count-finished">0</span>
                </div>
                <div class="kanban-cards" id="cards-finished"></div>
            </div>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/user.js"></script>
</body>
</html>
